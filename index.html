<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .tiktok {
            background: #000;
            color: white;
        }
        .whatsapp {
            background: #25D366;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://via.placeholder.com/100" alt="Foto Profil" class="profile-img">
        <h1>nih guys</h1>
        <p>Follow & gabung saluran WhatsApp ya!</p>
        
        <a href="https://www.tiktok.com/@intinyarispek7" class="link-btn tiktok" target="_blank">
            🎵 TikTok Saya
        </a>
        
        <a href="https://whatsapp.com/channel/0029VbBWwKF5Ejxybp8REG3Z" class="link-btn whatsapp" target="_blank">
            💬 Saluran WhatsApp
        </a>
    </div>
</body>
</html>
